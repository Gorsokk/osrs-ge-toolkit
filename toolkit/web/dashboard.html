<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OSRS Toolkit</title>
<link rel="icon" href="/favicon.ico">
<style>
  :root {
    --bg: #14171c; --panel: #1c2028; --panel2: #222734; --border: #2a2f3a;
    --text: #e8eaed; --muted: #8a919e; --green: #4caf7d;
    --red: #e0616b; --amber: #d9a441; --accent: #6ea8fe; --claude: #d97757;
  }
  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--text); font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         margin: 0; padding: 0 20px 40px; font-size: 14px; }
  a { color: var(--accent); }
  header { display: flex; align-items: center; gap: 14px; padding: 16px 0 10px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 13px; }
  nav { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; flex-wrap: wrap; }
  nav button { background: none; border: 0; color: var(--muted); padding: 10px 14px; font-size: 14px; cursor: pointer;
               border-bottom: 2px solid transparent; }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  .page { display: none; } .page.active { display: block; }
  .banner { border-radius: 10px; padding: 12px 16px; margin-bottom: 14px; display: flex; gap: 12px;
            align-items: center; flex-wrap: wrap; }
  .banner .grow { flex: 1; min-width: 240px; }
  .b-info { background: rgba(110,168,254,.10); border: 1px solid var(--accent); }
  .b-warn { background: rgba(217,164,65,.12); border: 1px solid var(--amber); }
  .b-claude { background: rgba(217,119,87,.12); border: 1px solid var(--claude); }
  .b-update { background: rgba(76,175,125,.12); border: 1px solid var(--green); }
  .btn { background: var(--accent); color: #0b1220; border: 0; border-radius: 8px; padding: 8px 14px; font-weight: 600;
         cursor: pointer; font-size: 13px; text-decoration: none; display: inline-block; }
  .btn.claude { background: var(--claude); color: #fff; } .btn.green { background: var(--green); color: #07140d; }
  .btn.ghost { background: transparent; color: var(--text); border: 1px solid var(--border); }
  .btn:disabled { opacity: .5; cursor: default; }
  .cards { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 22px; }
  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 12px 16px; min-width: 150px; }
  .card .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
  .card .value { font-size: 20px; font-weight: 600; margin-top: 2px; }
  .card .hint { color: var(--muted); font-size: 12px; margin-top: 2px; }
  h2 { font-size: 14px; color: var(--accent); margin: 24px 0 8px; }
  h2 .muted { font-weight: 400; }
  .muted { color: var(--muted); }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; }
  tr:hover { background: rgba(255,255,255,.03); }
  td.left, th.left { text-align: left; }
  .vol { color: var(--amber); } .ok { color: var(--green); } .warn { color: var(--amber); } .bad { color: var(--red); }
  .bar { background: var(--border); border-radius: 4px; height: 6px; width: 90px; display: inline-block; vertical-align: middle; margin-right: 6px; }
  .bar > span { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
  .bar.done > span { background: var(--green); }
  .tag { font-size: 11px; padding: 2px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--muted); }
  .tag.buy { color: var(--accent); border-color: var(--accent); } .tag.sell { color: var(--amber); border-color: var(--amber); }
  .tag.ready { color: var(--green); border-color: var(--green); }
  .empty { color: var(--muted); padding: 14px 0; }
  .grid2 { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
  .panel h3 { margin: 0 0 4px; font-size: 15px; }
  .panel p.desc { color: var(--muted); margin: 0 0 12px; font-size: 13px; }
  .field { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 7px 0;
           border-top: 1px solid var(--border); }
  .field:first-of-type { border-top: 0; }
  .field label { flex: 1; } .field small { display: block; color: var(--muted); font-size: 12px; }
  input[type=number], input[type=text], input[type=password], select, textarea {
    background: var(--panel2); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  input[type=number] { width: 110px; text-align: right; } textarea { width: 100%; min-height: 110px; font-family: inherit; }
  .switch { position: relative; width: 38px; height: 22px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch span { position: absolute; inset: 0; background: var(--border); border-radius: 22px; cursor: pointer; transition: .15s; }
  .switch span:before { content: ""; position: absolute; width: 16px; height: 16px; left: 3px; top: 3px; background: #fff; border-radius: 50%; transition: .15s; }
  .switch input:checked + span { background: var(--green); } .switch input:checked + span:before { transform: translateX(16px); }
  .savebar { position: sticky; bottom: 0; background: var(--bg); padding: 12px 0; display: flex; gap: 12px; align-items: center;
             border-top: 1px solid var(--border); margin-top: 16px; }
  .panel.wide { grid-column: 1 / -1; }
  #watch input[type=number] { width: 120px; } #watch input[type=text] { width: 100%; min-width: 180px; }
  .examples { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 10px; margin-top: 10px; }
  .example { background: var(--panel2); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; }
  .example:hover { border-color: var(--claude); }
  .example small { color: var(--muted); display: block; margin-top: 4px; }
  .wildy { border-radius: 10px; padding: 10px 16px; margin-bottom: 14px; font-weight: 600; }
  .wildy-low { background: rgba(217,164,65,.12); border: 1px solid var(--amber); color: var(--amber); }
  .wildy-high { background: rgba(224,97,107,.15); border: 1px solid var(--red); color: var(--red); }
  footer { color: var(--muted); font-size: 12px; margin-top: 30px; }
  .toast { position: fixed; bottom: 20px; right: 20px; background: var(--panel2); border: 1px solid var(--border);
           border-radius: 8px; padding: 10px 14px; display: none; max-width: 380px; }
</style>
</head>
<body>
<header>
  <h1>OSRS Toolkit</h1>
  <span class="sub" id="meta"></span>
  <button class="btn green" id="playBtn" style="margin-left:auto" data-i18n="play"></button>
</header>
<nav id="tabs">
  <button data-tab="overview" class="active" data-i18n="tab_overview"></button>
  <button data-tab="market" data-i18n="tab_market"></button>
  <button data-tab="progress" data-i18n="tab_progress"></button>
  <button data-tab="claude" data-i18n="tab_claude"></button>
  <button data-tab="settings" data-i18n="tab_settings"></button>
</nav>
<div id="banners"></div>

<!-- ============================================================ OVERVIEW -->
<section class="page active" id="page-overview">
  <div id="wildy"></div>
  <div class="cards" id="cards"></div>
  <h2><span data-i18n="ge_title"></span> <span class="muted" id="geAge"></span></h2>
  <div class="scroll"><table id="geOffers"><thead></thead><tbody></tbody></table></div>
  <div class="empty" id="geEmpty" style="display:none" data-i18n="ge_missing"></div>
</section>

<!-- ============================================================== MARKET -->
<section class="page" id="page-market">
  <p class="muted" id="marketMeta"></p>
  <h2 data-i18n="alch_title"></h2>
  <p class="muted" data-i18n="alch_desc"></p>
  <div class="scroll"><table id="alch"><thead></thead><tbody></tbody></table></div>
  <h2 data-i18n="yield_title"></h2>
  <div class="scroll"><table id="yield"><thead></thead><tbody></tbody></table></div>
  <h2 data-i18n="fast_title"></h2>
  <div class="scroll"><table id="fastest"><thead></thead><tbody></tbody></table></div>
</section>

<!-- ============================================================ PROGRESS -->
<section class="page" id="page-progress">
  <div class="grid2">
    <div><h2 data-i18n="quests_title"></h2><div id="quests"></div></div>
    <div><h2 data-i18n="ca_title"></h2><table id="ca"><thead></thead><tbody></tbody></table></div>
  </div>
  <h2 data-i18n="diaries_title"></h2>
  <div class="scroll"><table id="diaries"><thead></thead><tbody></tbody></table></div>
</section>

<!-- ============================================================== CLAUDE -->
<section class="page" id="page-claude">
  <div class="panel">
    <h3 data-i18n="claude_h"></h3>
    <p class="desc" data-i18n="claude_desc"></p>
    <div id="claudeStatus"></div>
    <h3 style="margin-top:18px" data-i18n="claude_try"></h3>
    <p class="desc" data-i18n="claude_try_desc"></p>
    <div class="examples" id="examples"></div>
    <p class="muted" style="margin-top:16px" data-i18n="claude_privacy"></p>
  </div>
</section>

<!-- ============================================================ SETTINGS -->
<section class="page" id="page-settings">
  <div class="grid2" id="settingsForm"></div>
  <div class="savebar">
    <button class="btn green" id="saveBtn" data-i18n="save"></button>
    <span class="muted" id="saveMsg"></span>
  </div>
</section>

<footer id="footer"></footer>
<div class="toast" id="toast"></div>

let LANG = "en", STATE = null, SETTINGS = null, dirty = false;
const T = (k, v = {}) => (I18N[LANG][k] ?? I18N.en[k] ?? k).replace(/\{(\w+)\}/g, (_, x) => v[x] ?? "");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[c]));
function applyI18n() {
  document.documentElement.lang = LANG;
  document.querySelectorAll("[data-i18n]").forEach(el => el.innerHTML = T(el.dataset.i18n));
}
function fmt(n) {
  if (typeof n !== "number") return n ?? "";
  return Number.isInteger(n) ? n.toLocaleString(LANG === "fr" ? "fr-CA" : "en-US") : n.toFixed(2);
}
function gp(n) {
  if (typeof n !== "number") return "—";
  const a = Math.abs(n);
  if (a >= 1e6) return (n / 1e6).toFixed(2) + "M";
  if (a >= 1e4) return (n / 1e3).toFixed(1) + "k";
  return fmt(n);
}
function ago(minutes) {
  if (minutes == null) return "—";
  if (minutes < 1) return T("just_now");
  if (minutes < 90) return T("min_ago", {n: Math.round(minutes)});
  return T("h_ago", {n: (minutes / 60).toFixed(1)});
}
const ageOf = iso => iso ? (Date.now() - new Date(iso).getTime()) / 60000 : null;
async function getJSON(url) { const r = await fetch(url, {cache: "no-store"}); if (!r.ok) throw new Error(r.status); return r.json(); }
async function tryJSON(url) { try { return await getJSON(url); } catch (e) { return null; } }
async function post(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json", "X-Toolkit": "1"}, body: JSON.stringify(body)});
  return r.json();
}
function toast(msg) { const el = document.getElementById("toast"); el.textContent = msg; el.style.display = "block"; clearTimeout(el._t); el._t = setTimeout(() => el.style.display = "none", 3500); }

// ------------------------------------------------------------------ tabs
function showTab(name) {
  document.querySelectorAll("#tabs button").forEach(b => b.classList.toggle("active", b.dataset.tab === name));
  document.querySelectorAll(".page").forEach(p => p.classList.toggle("active", p.id === "page-" + name));
  if (location.hash !== "#" + name) history.replaceState(null, "", "#" + name);
  if (name === "settings") loadSettings();
}
document.querySelectorAll("#tabs button").forEach(b => b.onclick = () => showTab(b.dataset.tab));

function renderTable(id, rows, cols) {
  const t = document.getElementById(id);
  t.querySelector("thead").innerHTML = "<tr>" + cols.map(c => `<th class="${c[2] || ""}">${T(c[1])}</th>`).join("") + "</tr>";
  if (!rows || !rows.length) { t.querySelector("tbody").innerHTML = `<tr><td class="muted left" colspan="${cols.length}">${T("no_scan")}</td></tr>`; return; }
  t.querySelector("tbody").innerHTML = rows.map(r => "<tr>" + cols.map(c => {
    let v = r[c[0]];
    if (c[0] === "name") v = esc(v) + (r.volatile ? ' <span class="vol">⚠</span>' : "");
    else if (c[0] === "roi_pct") v = fmt(v) + "%";
    else if (c[0] === "fill_ratio") v = Math.round((v || 0) * 100) + "%";
    else v = fmt(v);
    return `<td class="${c[2] || ""}">${v}</td>`;
  }).join("") + "</tr>").join("");
}
const FLIP_COLS = [["name", "item"], ["buy_at", "c_buy"], ["sell_at", "c_sell"], ["roi_pct", "c_roi"], ["qty_per_cycle", "c_qty"],
                   ["gp_per_hour", "c_gph"], ["capital_needed", "c_capital"], ["fill_ratio", "c_fill"]];
const ALCH_COLS = [["name", "item"], ["buy_at", "c_buy"], ["max_buy_price", "c_max"], ["alch_value", "c_alch"], ["profit_per_cast", "c_ppc"],
                   ["gp_per_hour", "c_gph_alch"], ["capital_1h", "c_cap1h"], ["qty_per_cycle", "c_qty4"], ["profit_per_cycle", "c_p4"]];

function marketHint(s, m) {
  if (!m || s.complete || s.cancelled) return "";
  const lo = m.low_5m || m.low_1h, hi = m.high_5m || m.high_1h;
  if (!lo || !hi) return `<span class="muted">${T("m_noprice")}</span>`;
  const range = `<span class="muted">${T("m_range", {lo: fmt(lo), hi: fmt(hi)})}</span>`;
  let h;
  if (s.type === "BUY") h = s.price < lo ? ["bad", "m_buy_low"] : s.price <= lo ? ["warn", "m_buy_slow"] : s.price > hi ? ["warn", "m_buy_high"] : ["ok", "m_in"];
  else h = s.price > hi ? ["bad", "m_sell_high"] : s.price >= hi ? ["warn", "m_sell_slow"] : s.price < lo ? ["warn", "m_sell_low"] : ["ok", "m_in"];
  return `<span class="${h[0]}">${T(h[1])}</span> · ${range}`;
}
function renderGE(ge, market) {
  const t = document.getElementById("geOffers");
  document.getElementById("geEmpty").style.display = ge ? "none" : "block";
  t.style.display = ge ? "" : "none";
  if (!ge) { document.getElementById("geAge").textContent = ""; return; }
  t.querySelector("thead").innerHTML = `<tr><th>${T("slot")}</th><th class="left">${T("item")}</th><th>${T("offer")}</th><th>${T("filled")}</th><th>${T("avg_real")}</th><th>${T("state")}</th><th class="left">${T("market")}</th></tr>`;
  t.querySelector("tbody").innerHTML = (ge.slots || []).map(s => {
    if (s.state === "EMPTY") return `<tr><td>${s.slot}</td><td class="left muted">${T("empty_slot")}</td><td></td><td></td><td></td><td class="muted">${T("free")}</td><td></td></tr>`;
    const ready = s.complete || s.cancelled, pct = Math.max(0, Math.min(100, s.progress_pct || 0));
    const tag = `<span class="tag ${ready ? "ready" : s.type === "BUY" ? "buy" : "sell"}">${T(s.type === "BUY" ? "buy" : "sell")}</span>`;
    return `<tr><td>${s.slot}</td><td class="left">${tag} ${esc(s.item_name)}</td><td>${fmt(s.price)}</td>
      <td><span class="bar ${pct >= 100 ? "done" : ""}"><span style="width:${pct}%"></span></span>${fmt(s.quantity_filled)} / ${fmt(s.quantity_total)}</td>
      <td>${s.avg_price != null ? fmt(s.avg_price) : "—"}</td><td>${T("st_" + s.state)}</td>
      <td class="left">${marketHint(s, (market || {})[String(s.item_id)])}</td></tr>`;
  }).join("");
  document.getElementById("geAge").textContent = "· " + T("updated", {age: ago(ageOf(ge.exported_at))});
}
function wildernessLevel(p) {
  if (!p || typeof p.y !== "number" || p.x < 2944 || p.x > 3392) return null;
  if (p.y >= 3520 && p.y <= 3968) return Math.floor((p.y - 3520) / 8) + 1;
  if (p.y >= 9920 && p.y <= 10368) return Math.floor((p.y - 9920) / 8) + 1;
  return null;
}
function renderProgress(q, d, ca) {
  const qs = (q && q.quests) || [];
  const prog = qs.filter(x => x.state === "IN_PROGRESS"), done = qs.filter(x => x.state === "FINISHED").length;
  document.getElementById("quests").innerHTML = q ?
    `<p class="muted">${T("quests_done", {done, prog: prog.length, todo: qs.length - done - prog.length})}</p>` +
    (prog.length ? "<ul>" + prog.map(x => `<li><a target="_blank" href="https://oldschool.runescape.wiki/w/${encodeURIComponent(x.name.replace(/ /g, "_"))}/Quick_guide">${esc(x.name)}</a></li>`).join("") + "</ul>" : `<p class="muted">${T("no_quests")}</p>`)
    : `<p class="muted">—</p>`;
  const dt = document.getElementById("diaries"), tiers = ["easy", "medium", "hard", "elite"], di = (d && d.diaries) || {};
  dt.querySelector("thead").innerHTML = `<tr><th>${T("region")}</th>` + tiers.map(x => `<th>${x}</th>`).join("") + "</tr>";
  dt.querySelector("tbody").innerHTML = Object.keys(di).sort().map(r => `<tr><td>${esc(r)}</td>` + tiers.map(x => {
    const v = di[r][x]; return v ? `<td class="${v.complete ? "ok" : ""}">${v.complete ? "✓" : (v.tasks_done || 0)}</td>` : "<td>—</td>";
  }).join("") + "</tr>").join("");
  const ct = document.getElementById("ca"), ti = (ca && ca.tiers) || {};
  ct.querySelector("thead").innerHTML = `<tr><th>${T("tier")}</th><th>${T("done")}</th><th>${T("total")}</th></tr>`;
  ct.querySelector("tbody").innerHTML = Object.keys(ti).map(k => `<tr><td>${esc(k)}</td><td class="${ti[k].complete ? "ok" : ""}">${ti[k].tasks_completed}</td><td>${ti[k].tasks_total}</td></tr>`).join("");
}
function coins(c) { return ((c && c.items) || []).filter(i => i.id === 995).reduce((a, i) => a + i.quantity, 0); }

async function refresh() {
  const st = await tryJSON("/api/state");
  if (!st) return;
  if (st.language !== LANG) { LANG = st.language; applyI18n(); }
  STATE = st;
  renderBanners(st);
  renderClaude(st);
  const [m, pos, ge, bank, inv, q, d, ca] = await Promise.all(
    ["market.json", "position.json", "ge_offers.json", "bank.json", "inventory.json", "quests.json", "diaries.json", "combat_achievements.json"]
      .map(f => tryJSON("/data/" + f)));
  document.getElementById("meta").innerHTML = st.character
    ? `${T("char")}: <b>${esc(st.character)}</b>` + (m ? ` · ${T("mode")}: <b>${T(m.mode === "members" ? "members" : "f2p")}</b>` : "")
    : "";
  const cash = bank ? coins(bank) + coins(inv) : (m ? m.capital_gp : null);
  const freeSlots = ge ? (ge.slots || []).filter(s => s.state === "EMPTY").length : (m ? m.free_slots : null);
  const lvl = wildernessLevel(pos);
  document.getElementById("wildy").innerHTML = lvl ? `<div class="wildy ${lvl >= 20 ? "wildy-high" : "wildy-low"}">${T("wildy", {lvl})}</div>` : "";
  document.getElementById("cards").innerHTML = st.character ? `
    <div class="card"><div class="label">${T("cash")}</div><div class="value">${gp(cash)}</div><div class="hint">${T("cash_hint")} · ${T("bank_age", {age: ago(st.file_ages_min["bank.json"])})}</div></div>
    ${ge ? `<div class="card"><div class="label">${T("locked")}</div><div class="value">${gp(ge.gp_locked_in_buys)}</div></div>` : ""}
    <div class="card"><div class="label">${T("slots")}</div><div class="value">${freeSlots ?? "—"} / ${m ? m.slots : 8}</div></div>
    <div class="card"><div class="label">${T("budget")}</div><div class="value">${freeSlots ? gp(Math.floor(cash / freeSlots)) : "—"}</div></div>
    ${m ? `<div class="card"><div class="label">${T("magic")}</div><div class="value">${m.magic_level}</div></div>` : ""}
    ${pos ? `<div class="card"><div class="label">${T("position")}</div><div class="value">${pos.x}, ${pos.y}</div><div class="hint">W${pos.world} · ${ago(ageOf(pos.exported_at))}</div></div>` : ""}` : "";
  renderGE(ge, m && m.ge_market);
  document.getElementById("marketMeta").textContent = m ? T("market_meta", {age: ago(ageOf(m.generated_at))}) : T("no_scan");
  renderTable("alch", m && m.alch, ALCH_COLS);
  renderTable("yield", m && m.flips_best_gp_per_hour, FLIP_COLS);
  renderTable("fastest", m && m.flips_fastest_fill, FLIP_COLS);
  renderProgress(q, d, ca);
  document.getElementById("footer").textContent = T("footer", {v: st.version, t: new Date().toLocaleTimeString(LANG === "fr" ? "fr-CA" : "en-US")});
}

// -------------------------------------------------------------- settings
const sw = (id, on) => `<span class="switch"><input type="checkbox" id="${id}" ${on ? "checked" : ""}><span onclick="this.previousElementSibling.click()"></span></span>`;
const num = (id, v, step = 1) => `<input type="number" id="${id}" value="${v}" step="${step}" min="0">`;
const row = (label, control, small = "") => `<div class="field"><label>${T(label)}${small ? `<small>${T(small)}</small>` : ""}</label>${control}</div>`;
function panel(title, desc, body, cls = "") { return `<div class="panel ${cls}"><h3>${T(title)}</h3><p class="desc">${T(desc)}</p>${body}</div>`; }
function watchRow(name = "", w = {}) {
  return `<tr><td class="left"><input type="text" class="w-name" value="${esc(name)}" placeholder="Old school bond"></td>
    <td>${num("", w.cost || "").replace('id=""', 'class="w-cost"')}</td><td>${num("", w.sell_alert_at || "").replace('id=""', 'class="w-sell"')}</td>
    <td>${num("", w.buy_alert_at || "").replace('id=""', 'class="w-buy"')}</td><td><button class="btn ghost" onclick="this.closest('tr').remove()">✕</button></td></tr>`;
}
async function loadSettings() {
  if (dirty) return;
  const r = await tryJSON("/api/settings");
  if (!r) return;
  SETTINGS = r;
  const s = r.settings, a = r.alerts, chars = (STATE && STATE.characters) || [];
  const g = a.ge_offers, f = a.flips, mv = a.moves, n = a.news, sp = a.stockpile;
  document.getElementById("settingsForm").innerHTML =
    panel("s_general", "s_general_d",
      row("s_lang", `<select id="language"><option value="en" ${s.language === "en" ? "selected" : ""}>English</option><option value="fr" ${s.language === "fr" ? "selected" : ""}>Français</option></select>`) +
      row("s_char", `<select id="character"><option value="">${T("s_char_auto")}</option>${chars.map(c => `<option ${s.character === c ? "selected" : ""}>${esc(c)}</option>`).join("")}</select>`) +
      row("s_scan", num("scan_min", Math.round(s.scan_interval_sec / 60))) +
      row("s_open", sw("open_dashboard_on_start", s.open_dashboard_on_start)) +
      row("s_autostart", sw("autostart", r.autostart)) +
      row("s_updates", sw("check_updates", s.check_updates) +
        ` <button class="btn ghost" type="button" style="margin-left:8px" onclick="checkUpdateNow(this)">${T("check_now")}</button>`)) +
    panel("s_rl", "s_rl_d",
      row("s_rl_launch", sw("launch_runelite", s.launch_runelite), "s_rl_launch_s") +
      `<label style="display:block;margin-top:12px">${T("s_rl_path")}<small style="display:block;margin:2px 0 6px">${T("s_rl_path_s")}</small></label>
       <input type="text" id="runelite_path" value="${esc(s.runelite_path || "")}" placeholder="C:\\Users\\…\\AppData\\Local\\RuneLite\\RuneLite.exe" style="width:100%">
       <p class="muted">${STATE && STATE.runelite && STATE.runelite.target ? T("s_rl_found", {p: esc(STATE.runelite.target)}) : T("s_rl_none")}</p>`) +
    panel("s_stream", "s_stream_d",
      row("s_st_on", sw("stream_enabled", s.stream_enabled)) +
      row("s_st_chan", `<input type="text" id="stream_channel" value="${esc(s.stream_channel || "")}" placeholder="blodvis" style="width:180px">`) +
      row("s_st_name", `<input type="text" id="stream_display_name" value="${esc(s.stream_display_name || "")}" style="width:180px">`, "s_st_name_s") +
      row("s_st_bot", `<input type="text" id="stream_bot_name" value="${esc(s.stream_bot_name || "")}" style="width:180px">`, "s_st_bot_s") +
      row("s_st_tok", `<input type="password" id="stream_bot_token" value="${esc(s.stream_bot_token || "")}" placeholder="oauth:…" style="width:180px" autocomplete="off">`, "s_st_tok_s") +
      row("s_st_kofi", `<input type="text" id="stream_kofi_url" value="${esc(s.stream_kofi_url || "")}" placeholder="https://ko-fi.com/…" style="width:240px">`) +
      row("s_st_tool", `<input type="text" id="stream_toolkit_url" value="${esc(s.stream_toolkit_url || "")}" style="width:240px">`, "s_st_tool_s") +
      `<p class="muted" id="streamStatus"></p>
       <label style="display:block;margin-top:10px">${T("s_st_src")}</label>
       <div style="display:grid;gap:4px;margin-top:6px">${["overlay", "starting", "brb", "ending"].map(p =>
         `<code style="user-select:all">${location.origin}/stream/${p}</code>`).join("")}</div>
       <p class="muted">${T("s_st_src_d")}</p>
       <label style="display:block;margin-top:10px">${T("s_st_test")}</label>
       <div style="display:flex;gap:8px;margin-top:6px"><input type="text" id="stream_test" value="!bond" style="flex:1">
         <button class="btn ghost" id="streamTestBtn" type="button">${T("s_st_run")}</button></div>
       <p class="muted" id="streamTestOut"></p>`, "wide") +
    panel("s_br", "s_br_d",
      row("s_br_on", sw("bridge_enabled", s.bridge_enabled)) +
      row("s_br_dom", `<input type="text" id="bridge_domain" value="${esc(s.bridge_domain || "")}" placeholder="name.ngrok-free.app" style="width:240px">`, "s_br_dom_s") +
      row("s_br_ngrok", sw("bridge_run_ngrok", s.bridge_run_ngrok), "s_br_ngrok_s") +
      `<label style="display:block;margin-top:10px">${T("s_br_url")}</label>
       <div style="display:flex;gap:8px;margin-top:6px;align-items:center"><code id="bridgeUrl" style="user-select:all;word-break:break-all;flex:1">…</code>
         <button class="btn ghost" id="bridgeCopy" type="button">${T("s_br_copy")}</button></div>
       <p class="muted" id="bridgeStatus"></p>
       <button class="btn ghost" id="bridgeNew" type="button">${T("s_br_new")}</button>
       <p class="muted" style="margin-top:10px">${T("s_br_steps")}</p>`, "wide") +
    panel("s_ge", "s_ge_d",
      row("s_on", sw("ge_enabled", g.enabled)) +
      row("s_miles", `<input type="text" id="ge_miles" value="${(g.partial_milestones_pct || []).join(", ")}" style="width:110px">`, "s_miles_s") +
      row("s_stuck_pct", num("ge_stuck_pct", g.unrealistic_pct, 0.5)) + row("s_stuck_min", num("ge_stuck_min", g.unrealistic_after_min))) +
    panel("s_flip", "s_flip_d",
      row("s_on", sw("flip_enabled", f.enabled)) + row("s_flip_min", num("flip_min", f.min_profit_per_cycle, 1000)) +
      row("s_flip_roi", num("flip_roi", f.min_roi_pct, 0.5)) + row("s_flip_cap", num("flip_cap", f.max_capital_per_slot, 10000)) +
      row("s_flip_max", num("flip_max", f.max_alerts_per_scan)) + row("s_flip_cd", num("flip_cd", f.cooldown_hours))) +
    panel("s_bond", "s_bond_d",
      row("s_on", sw("bond_enabled", mv.bond_enabled !== false)) + row("s_bond_pct", num("bond_pct", mv.bond_alert_pct_below_7d, 0.5)) +
      row("s_bond_fixed", num("bond_fixed", mv.bond_alert_below, 100000))) +
    panel("s_moves", "s_moves_d", row("s_on", sw("moves_enabled", mv.enabled)) + row("s_moves_pct", num("moves_pct", mv.min_move_pct, 1))) +
    panel("s_news", "s_news_d", row("s_on", sw("news_enabled", n.enabled)) +
      `<label>${T("s_news_kw")}</label><textarea id="news_kw" style="min-height:60px">${esc((n.priority_keywords || []).join(", "))}</textarea>`) +
    panel("s_stock", "s_stock_d", row("s_on", sw("stock_enabled", sp.enabled)) + row("s_stock_disc", num("stock_disc", sp.min_discount_pct, 1)) +
      `<label>${T("s_stock_items")}</label><textarea id="stock_items">${esc((sp.items || []).join("\n"))}</textarea>`) +
    panel("s_watch", "s_watch_d", `<table id="watch"><thead><tr><th class="left">${T("s_w_item")}</th><th>${T("s_w_cost")}</th><th>${T("s_w_sell")}</th><th>${T("s_w_buy")}</th><th></th></tr></thead>
      <tbody>${Object.entries(g.watch || {}).map(([k, w]) => watchRow(k, w)).join("")}</tbody></table>
      <button class="btn ghost" style="margin-top:8px" onclick="document.querySelector('#watch tbody').insertAdjacentHTML('beforeend', watchRow())">${T("s_w_add")}</button>`, "wide");
  document.querySelectorAll("#settingsForm input, #settingsForm select, #settingsForm textarea").forEach(el => { if (el.id !== "stream_test") el.addEventListener("input", () => dirty = true); });
  val("streamTestBtn").onclick = async () => {
    try {
      const r = await post("/api/stream/command", {user: "you", text: val("stream_test").value});
      val("streamTestOut").textContent = (r.answers || []).map(a => a.text).join(" | ") || "—";
    } catch (e) { val("streamTestOut").textContent = e.message; }
  };
  tryJSON("/api/stream/state").then(st => { if (st) val("streamStatus").textContent = T("s_st_status", {s: st.chat_status}); });
  const showBridge = b => {
    if (!b) return;
    val("bridgeUrl").textContent = b.url || T("s_br_nourl");
    val("bridgeStatus").textContent = T("s_br_status", {s: b.status}) + (b.error ? " — " + b.error : "");
  };
  tryJSON("/api/bridge").then(showBridge);
  val("bridgeCopy").onclick = () => { navigator.clipboard.writeText(val("bridgeUrl").textContent); toast(T("copied")); };
  val("bridgeNew").onclick = async () => showBridge(await post("/api/bridge/new-secret", {}));
}
const val = id => document.getElementById(id);
const on = id => val(id).checked, nv = id => Number(val(id).value || 0);
val("saveBtn").onclick = async () => {
  const watch = {};
  document.querySelectorAll("#watch tbody tr").forEach(tr => {
    const name = tr.querySelector(".w-name").value.trim();
    if (name) watch[name] = {cost: tr.querySelector(".w-cost").value, sell_alert_at: tr.querySelector(".w-sell").value, buy_alert_at: tr.querySelector(".w-buy").value};
  });
  const body = {
    settings: {language: val("language").value, character: val("character").value || null,
               scan_interval_sec: Math.max(1, nv("scan_min")) * 60, open_dashboard_on_start: on("open_dashboard_on_start"),
               check_updates: on("check_updates"), launch_runelite: on("launch_runelite"),
               runelite_path: val("runelite_path").value.trim(),
               stream_enabled: on("stream_enabled"), stream_channel: val("stream_channel").value.trim().replace(/^.*twitch\.tv\//, ""),
               stream_display_name: val("stream_display_name").value.trim(), stream_bot_name: val("stream_bot_name").value.trim(),
               stream_bot_token: val("stream_bot_token").value.trim(), stream_kofi_url: val("stream_kofi_url").value.trim(),
               stream_toolkit_url: val("stream_toolkit_url").value.trim(),
               bridge_enabled: on("bridge_enabled"), bridge_run_ngrok: on("bridge_run_ngrok"),
               bridge_domain: val("bridge_domain").value.trim().replace(/^https?:\/\//, "").replace(/\/.*$/, "")},
    autostart: on("autostart"),
    alerts: {
      ge_offers: {enabled: on("ge_enabled"), partial_milestones_pct: val("ge_miles").value.split(","), unrealistic_pct: nv("ge_stuck_pct"),
                  unrealistic_after_min: nv("ge_stuck_min"), watch},
      flips: {enabled: on("flip_enabled"), min_profit_per_cycle: nv("flip_min"), min_roi_pct: nv("flip_roi"),
              max_capital_per_slot: nv("flip_cap"), max_alerts_per_scan: nv("flip_max"), cooldown_hours: nv("flip_cd")},
      moves: {enabled: on("moves_enabled"), min_move_pct: nv("moves_pct"), bond_enabled: on("bond_enabled"),
              bond_alert_pct_below_7d: nv("bond_pct"), bond_alert_below: nv("bond_fixed")},
      news: {enabled: on("news_enabled"), priority_keywords: val("news_kw").value.split(",")},
      stockpile: {enabled: on("stock_enabled"), min_discount_pct: nv("stock_disc"), items: val("stock_items").value.split("\n")},
    }
  };
  try {
    const r = await post("/api/settings", body);
    if (!r.ok) throw new Error(r.error || "error");
    dirty = false;
    val("saveMsg").textContent = "";
    await refresh(); await loadSettings();
    val("saveMsg").textContent = T("saved");
  } catch (e) { val("saveMsg").textContent = T("save_err", {e: e.message}); }
};

// ------------------------------------------------------------------ updates
async function checkUpdateNow(btn) {
  btn.disabled = true;
  try {
    const u = await post("/api/check-update", {});
    toast(u.update_available ? T("upd_found", {v: u.latest}) : T("upd_none", {v: u.current}));
    await refresh();
  } catch (e) { toast(T("upd_fail", {e: e.message})); }
  btn.disabled = false;
}
async function installUpdate(btn) {
  btn.disabled = true;
  toast(T("upd_dl"));
  try {
    const r = await post("/api/update/install", {});
    if (!r.ok) throw new Error(r.message || r.error || "error");
  } catch (e) { toast(T("upd_fail", {e: e.message})); btn.disabled = false; }
}

// ------------------------------------------------------------------ play
document.getElementById("playBtn").onclick = async () => {
  try {
    const r = await post("/api/runelite", {});
    toast(r.ok ? T("play_ok") : T("play_fail", {e: r.message || r.error}));
  } catch (e) { toast(T("play_fail", {e: e.message})); }
};

// ------------------------------------------------------------------ boot
(async () => {
  await refresh();
  applyI18n();
  const tab = location.hash.replace("#", "");
  showTab(["overview", "market", "progress", "claude", "settings"].includes(tab) ? tab : "overview");
  setInterval(refresh, 5000);
})();
</script>
</body>
</html>
